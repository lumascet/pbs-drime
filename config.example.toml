# /etc/drime-s3gw/config.toml  (chmod 600, owned by root)
#
# Secrets can also come from the environment instead of this file:
#   DRIME_S3GW_ACCESS_KEY, DRIME_S3GW_SECRET_KEY, DRIME_S3GW_DRIME_TOKEN

# Credentials PBS uses to talk to the gateway (make up long random strings,
# e.g. `openssl rand -hex 24`). Enter the same values in the PBS S3 endpoint.
access_key = "CHANGE-ME"
secret_key = "CHANGE-ME"

# Drime personal access token: app.drime.cloud -> Settings -> Developers ->
# "Create token" (permission "All", or Restricted with read+write on files).
drime_token = "CHANGE-ME"

# The one bucket this gateway serves. Use the same name in the PBS datastore.
bucket = "pbs"
# Any value, but it must match the region set on the PBS S3 endpoint.
region = "us-west-1"

listen = "127.0.0.1"
port = 8443
tls = true                       # PBS only speaks HTTPS
cert = "/etc/drime-s3gw/cert.pem"
key = "/etc/drime-s3gw/key.pem"

# Drime folder (created if missing) that holds everything; may be nested ("a/b").
drime_root = "pbs-s3"
workspace_id = 0                 # 0 = personal space

# Local key -> Drime entry index. Losing it is recoverable (`rebuild-index`).
index_db = "/var/lib/drime-s3gw/index.sqlite"

hard_delete = true               # GC'd chunks skip the Drime trash
requests_per_minute = 6000       # Drime reports x-ratelimit-limit: 10000 per minute
max_inflight = 64             # concurrent Drime uploads/downloads; throughput is
                                 # roughly max_inflight * 4 MiB / Drime upload latency
retries = 6
http_timeout = 300
max_object_size = 268435456      # 256 MiB; PBS objects are normally <= 16 MiB
verify_uploads = true            # true: read 1 byte back after each upload; "full": read it
                                 # all back and compare MD5. Drime has been seen acknowledging
                                 # uploads whose data never reached storage.
prefill_chunk_folders = true     # create a datastore's 4096 chunk folders in the background
readahead = true                 # restores: prefetch the next chunks of the snapshot being read
readahead_window = 24            # chunks fetched ahead in parallel
readahead_cache_mib = 256        # RAM for prefetched chunks
log_level = "INFO"               # DEBUG logs every request
